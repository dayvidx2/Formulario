<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <h2 class="header">Formulario de contacto</h2>
    <link rel="stylesheet" href="css/style.css">  
</head>
<body>
    <form class="custom-form">

        <div>
            <label for="name">Nombre:</label>
            <input type="text" id="name" pattern="[A-Za-z]" name="user_name" required/>
        </div>

        <div>
            <label for="apellido">Apellido:</label>
            <input type="text" id="apellido" pattern="[A-Za-z]" name="user_apellido" required/>
        </div>

        <div>
            <label for="tipo">Tipo de documento</label>
            <select for="text" id="tipo" required>
                <option value="null"></option>
                <option value="CC">cedula</option>
                <option value="TI">Tarjeta de identidad</option>
                <option value="PA">Pasaporte</option>
            </select>
        </div>

        <div>
            <label for="numero">Numero de documento</label>
            <input type="number" id="numero" pattern="[0-9]+" name="user_numero" required/>
        </div>

        <div>
            <label for="numero">Correo</label>
            <input type="text" id="correo">
        </div>

        <div>
            <label for="numero">Pais Domicilio</label>
            <input type="text" id="pais">
        </div>

        <div>
            <label for="numero">Ciudad Domicilio</label>
            <input type="text" id="ciudad">
        </div>

        <div>
            <label for="celular">Numero de celular</label>
            <input type="number" id="celular" pattern="[0-9]+" name="user_celular" required/>
        </div>

        <div>
            <label for="fecha">Fecha de nacimiento</label>
            <input type="date" max="2028-12-31" id="fecha" name="user_fecha" required/>
        </div>

        <div>
            <label for="check">Politica de datos</label>
            <input type="checkbox" id="check" name="user_check" required/>
        </div>

        <div>
            <input type="button" id="button" value="ENVIAR">
        </div>

    </form>
</body>
</html>
